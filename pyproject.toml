[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transparencia-rpa"
version = "1.0.0"
description = "Robô assíncrono de consulta ao Portal da Transparência"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "playwright==1.63.0",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1", "filelock==4.0.3",
  "google-api-python-client==2.200.0", "google-auth-oauthlib==1.4.1",
  "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
transparencia = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
